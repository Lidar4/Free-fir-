name: Build Android App

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Verify Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew clean assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: simple-overlay-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Check Production Signing Configuration
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$STORE_PASSWORD" && -n "$KEY_PASSWORD" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Production signing secrets are configured."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Production signing secrets are not configured; release build will be skipped."
          fi

      - name: Decrypt & Build Production Release (APK & AAB)
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/my-release-key.jks
          export KEYSTORE_PATH="my-release-key.jks"
          ./gradlew assembleRelease bundleRelease --no-daemon

          BUILD_TOOLS_DIR="$ANDROID_SDK_ROOT/build-tools"
          LATEST_BUILD_TOOL=$(ls -1 "$BUILD_TOOLS_DIR" | sort -V | tail -n 1)
          APKSIGNER="$BUILD_TOOLS_DIR/$LATEST_BUILD_TOOL/apksigner"
          echo "Verifying Release APK signature using apksigner..."
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload Release APK
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: simple-overlay-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Release AAB Bundle
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: simple-overlay-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
